   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52626c" x="30.42" y="652.481523" transform="rotate(-0 30.42 652.481523)">При достаточных запасах пустых снабженцев освобождают; при нехватке цикл повторяется.</text>
   </g>
   <g id="text_7">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #24353e" transform="translate(94.665922 163.357422)">Запас + груз в пути</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #24353e" transform="translate(81.485141 180.907422)">ниже целевого уровня?</text>
   </g>
   <g id="text_8">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #24353e" transform="translate(391.7255 163.605234)">Да → назначить</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #24353e" transform="translate(379.669016 181.586875)">до 2–3 снабженцев</text>
   </g>
   <g id="text_9">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #24353e" transform="translate(624.507812 163.272109)">Назначение учитывается</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #24353e" transform="translate(652.751328 181.132891)">при выборе цели</text>
   </g>
   <g id="text_10">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #24353e" transform="translate(116.145375 344.037109)">Груз у гнезда</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #24353e" transform="translate(117.350922 360.492266)">→ разгрузить</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #24353e" transform="translate(93.952953 379.301641)">→ снять назначение</text>
   </g>
   <g id="text_11">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #24353e" transform="translate(369.322844 344.037109)">У еды: поесть самому,</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #24353e" transform="translate(378.894094 361.897891)">затем набрать груз</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #24353e" transform="translate(381.922687 379.447891)">и выбрать возврат</text>
   </g>
   <g id="text_12">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #24353e" transform="translate(640.810625 344.037109)">Направление к цели</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #24353e" transform="translate(639.891484 360.488203)">→ модель → декодер</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #24353e" transform="translate(668.969844 378.492188)">→ движение</text>
   </g>
   <g id="text_13">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #24353e" transform="translate(131.480844 549.372109)">Постоянные расходы и порча</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #24353e" transform="translate(149.943891 565.827266)">снова уменьшают запас</text>
   </g>
   <g id="text_14">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #24353e" transform="translate(539.545328 540.682422)">Отдельная проверка C++:</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #24353e" transform="translate(538.755172 557.483906)">родитель + запас + лимит</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #24353e" transform="translate(560.617516 576.350156)">→ яйцо → новый NPC</text>
   </g>
  </g>
