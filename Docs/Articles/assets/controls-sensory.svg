   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #52626c" transform="translate(845.257247 656.925406) rotate(-90)">ForwardHz &gt; 4</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52626c" x="30.42" y="843.965523" transform="rotate(-0 30.42 843.965523)">Назначение снабженцев, построение маршрутов и внешние роевые поправки отключены.</text>
   </g>
   <g id="text_8">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #24353e" transform="translate(128.808906 169.180094)">Все источники еды и воды,</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #24353e" transform="translate(126.830469 185.181266)">гнездо, тела и препятствия</text>
   </g>
   <g id="text_9">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #24353e" transform="translate(543.777266 168.726109)">Голод, жажда, груз, травмы</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #24353e" transform="translate(549.736953 186.276109)">и дефицит запасов гнезда</text>
   </g>
   <g id="text_10">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #24353e" transform="translate(199.434062 316.345172)">C++ суммирует вклады источников и задаёт силу раздражителей:</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #24353e" transform="translate(271.832891 334.006891)">еда ±, вода ±, гнездо ±, возбуждение, угроза</text>
   </g>
   <g id="text_11">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #24353e" transform="translate(134.851875 458.301109)">Адаптер: восемь каналов</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #24353e" transform="translate(134.472031 474.752203)">→ стимуляция отдельных</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #24353e" transform="translate(171.148281 492.302203)">входных групп</text>
   </g>
   <g id="text_12">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #24353e" transform="translate(575.833437 459.759547)">Полный коннектом</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #24353e" transform="translate(563.683516 475.206187)">→ активность выходов</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #24353e" transform="translate(617.000781 494.149625)">L / R / F</text>
   </g>
   <g id="text_13">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #24353e" transform="translate(155.231406 622.197594)">C++: сглаживание,</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #24353e" transform="translate(128.915547 638.42525)">движение тела и коллизии</text>
   </g>
   <g id="text_14">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #24353e" transform="translate(578.869141 621.715172)">Прежний декодер</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #24353e" transform="translate(585.40875 637.967203)">→ поворот и ход</text>
   </g>
   <g id="text_15">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #24353e" transform="translate(210.506406 762.115172)">C++: питание и укусы при контакте и достаточной активности;</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #24353e" transform="translate(259.840391 778.371266)">разгрузка и потомство — по правилам экономики</text>
   </g>
  </g>
 </g>
