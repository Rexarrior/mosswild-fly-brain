[package]
name = "brainlab-flybrain"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
objc2 = { version = "=0.6.4", default-features = false, features = ["std"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString"] }
objc2-metal = { version = "=0.3.2", default-features = false, features = ["std", "MTLTypes", "MTLAllocation", "MTLResource", "MTLBuffer", "MTLDevice", "MTLCommandQueue", "MTLCommandBuffer", "MTLCommandEncoder", "MTLComputeCommandEncoder", "MTLComputePipeline", "MTLLibrary"] }

[profile.release]
lto = "thin"
codegen-units = 1
